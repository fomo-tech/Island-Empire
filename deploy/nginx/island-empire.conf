# Install as /etc/nginx/conf.d/island-empire.conf after replacing example.com.
# Node listens on 127.0.0.1:4001, never on a public firewall rule.

limit_req_zone $binary_remote_addr zone=island_api:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=island_auth:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=island_challenge:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=island_conn:10m;

map $http_upgrade $island_connection_upgrade {
  default upgrade;
  '' close;
}

upstream island_api {
  server 127.0.0.1:4001;
  keepalive 32;
}

server {
  listen 80;
  server_name example.com;

  root /var/www/hexrivals/apps/game/dist;
  index index.html;

  server_tokens off;
  client_max_body_size 128k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 10s;
  send_timeout 15s;
  limit_conn island_conn 20;
  limit_req_status 429;
  limit_conn_status 429;

  # TLS should terminate here or at a CDN/WAF before this server.

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location /assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location = /api/auth/challenge {
    limit_req zone=island_challenge burst=3 nodelay;
    proxy_pass http://island_api;
    include /etc/nginx/snippets/island-proxy.conf;
  }

  location ~ ^/api/auth/(player/(login|register|guest)|admin/login)$ {
    limit_req zone=island_auth burst=2 nodelay;
    proxy_pass http://island_api;
    include /etc/nginx/snippets/island-proxy.conf;
  }

  location = /ws {
    limit_req zone=island_api burst=10 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $island_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 70s;
    proxy_send_timeout 15s;
    proxy_pass http://island_api;
  }

  location /api/ {
    limit_req zone=island_api burst=40 nodelay;
    proxy_pass http://island_api;
    include /etc/nginx/snippets/island-proxy.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
