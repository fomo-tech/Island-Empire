# Local verification gateway. Run the game with:
# VITE_API_URL=http://127.0.0.1:8081 npm --prefix apps/game run dev

limit_req_zone $binary_remote_addr zone=island_local_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=island_local_auth:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=island_local_challenge:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=island_local_conn:10m;

map $http_upgrade $island_local_connection_upgrade {
  default upgrade;
  '' close;
}

upstream island_local_api {
  server 127.0.0.1:4000;
  keepalive 16;
}

server {
  listen 8081;
  server_name 127.0.0.1 localhost;

  server_tokens off;
  client_max_body_size 128k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 10s;
  limit_conn island_local_conn 20;
  limit_req_status 429;
  limit_conn_status 429;

  location = /api/auth/challenge {
    limit_req zone=island_local_challenge burst=3 nodelay;
    proxy_pass http://island_local_api;
    include /opt/homebrew/etc/nginx/snippets/island-local-proxy.conf;
  }

  location ~ ^/api/auth/(player/(login|register|guest)|admin/login)$ {
    limit_req zone=island_local_auth burst=2 nodelay;
    proxy_pass http://island_local_api;
    include /opt/homebrew/etc/nginx/snippets/island-local-proxy.conf;
  }

  location = /ws {
    limit_req zone=island_local_api burst=10 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $island_local_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 70s;
    proxy_send_timeout 15s;
    proxy_pass http://island_local_api;
  }

  location /api/ {
    limit_req zone=island_local_api burst=40 nodelay;
    proxy_pass http://island_local_api;
    include /opt/homebrew/etc/nginx/snippets/island-local-proxy.conf;
  }
}
